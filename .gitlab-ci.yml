# Pipeline de Ominous Security
#
#   lint     sintaxis, 'use strict', JSON válido y sin caracteres invisibles/bidi
#   test     tests en Node 20, 22 y 24 (informe JUnit y cobertura en 22),
#            autoescaneo con la propia herramienta (informe Code Quality en la MR),
#            SAST y detección de secretos de GitLab, auditoría de dependencias
#   build    zip del código e imagen Docker en el Container Registry del proyecto
#   scan     escaneo de la imagen (Container Scanning de GitLab)
#   deploy   demo en GitLab Pages (modo demo, sin servidor)
#   release  release de GitLab al crear una etiqueta vX.Y.Z

stages: [lint, test, build, scan, deploy, release]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

variables:
  NODE_IMAGE: node:22-alpine
  OMINOUS_OFFLINE: "1"          # los tests no dependen de OSV.dev
  npm_config_cache: $CI_PROJECT_DIR/.npm
  # Plantillas de seguridad de GitLab: los tests generan sus repos trampa en
  # tiempo de ejecución, pero lib/rules.js y la demo contienen firmas de ataques.
  SAST_EXCLUDED_PATHS: "test, node_modules, public"
  SECRET_DETECTION_EXCLUDED_PATHS: "test, lib/rules.js, public/index.html"
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA

default:
  image: $NODE_IMAGE
  interruptible: true

# Los tests del historial y el empaquetado necesitan git (la imagen alpine no lo trae).
# No va en default: también afectaría a los jobs de las plantillas de GitLab.
.with-git:
  before_script:
    - apk add --no-cache git > /dev/null

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/Container-Scanning.gitlab-ci.yml

# ---------------------------------------------------------------- lint
lint:
  stage: lint
  script:
    - npm run lint

# ---------------------------------------------------------------- test
test:
  stage: test
  extends: .with-git
  image: node:${NODE_VERSION}-alpine
  parallel:
    matrix:
      - NODE_VERSION: ["20", "24"]
  script:
    - node --version
    - npm test

test:coverage:
  stage: test
  extends: .with-git
  script:
    - npm run test:ci
  coverage: '/all files\s*\|\s*([\d.]+)/'
  artifacts:
    when: always
    reports:
      junit: junit.xml

# La herramienta se analiza a sí misma. Las firmas de ataques (rules.js, la
# demo, el README) se excluyen igual que un antivirus excluye su base de firmas.
self-scan:
  stage: test
  variables:
    OMINOUS_OFFLINE: "0"        # aquí sí consulta OSV.dev para las dependencias
  script:
    - node bin/ominous-scan.js .
        --exclude lib/rules.js,lib/decoder.js,lib/extra.js,public/index.html,README.md,test/,node_modules/
        --fail-on red
        --codequality gl-code-quality-report.json
        --json ominous-report.json
  artifacts:
    when: always
    expose_as: Informe de Ominous
    paths: [ominous-report.json]
    reports:
      codequality: gl-code-quality-report.json

npm-audit:
  stage: test
  script:
    - npm audit --audit-level=high --include=optional
  allow_failure: true          # un aviso de un paquete opcional no debe bloquear

# ---------------------------------------------------------------- build
package:
  stage: build
  extends: .with-git
  script:
    - git archive --format=zip --prefix=ominous-security/ -o ominous-security-${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}.zip HEAD
  artifacts:
    name: ominous-security-$CI_COMMIT_REF_SLUG
    paths: ["ominous-security-*.zip"]
    expire_in: 30 days

docker:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  variables:
    DOCKER_TLS_CERTDIR: /certs
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build --pull -t "$IMAGE_TAG" .
    # prueba de humo: el servidor arranca y responde dentro del contenedor
    - docker run -d --name smoke "$IMAGE_TAG"
    - for i in $(seq 1 20); do docker exec smoke wget -qO- --header "Host: localhost:8080" http://127.0.0.1:8080/api/health && break; sleep 1; done
    - docker exec smoke wget -qO- --header "Host: localhost:8080" http://127.0.0.1:8080/api/health | grep -q '"ok":true'
    - docker exec smoke ominous-scan /app --exclude lib/rules.js,lib/decoder.js,lib/extra.js,public/index.html --fail-on red
    - docker rm -f smoke
    - docker push "$IMAGE_TAG"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "$IMAGE_TAG" "$CI_REGISTRY_IMAGE:latest" && docker push "$CI_REGISTRY_IMAGE:latest"
      fi
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag "$IMAGE_TAG" "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG" && docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [Dockerfile, package.json, package-lock.json]

# ---------------------------------------------------------------- scan
container_scanning:
  stage: scan
  needs: [docker]
  variables:
    CS_IMAGE: $IMAGE_TAG
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# ---------------------------------------------------------------- deploy
pages:
  stage: deploy
  script:
    - node scripts/build-pages.js site
  pages:
    publish: site
  artifacts:
    paths: [site]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---------------------------------------------------------------- release
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: [package, docker]
  script:
    - |
      VERSION=$(node -p "require('./package.json').version" 2>/dev/null || sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' package.json)
      if [ "$CI_COMMIT_TAG" != "v$VERSION" ]; then echo "La etiqueta $CI_COMMIT_TAG no coincide con la versión $VERSION de package.json"; exit 1; fi
    - echo "Publicando $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: Ominous Security $CI_COMMIT_TAG
    description: "Imagen: `$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG`. Código: ominous-security-$CI_COMMIT_TAG.zip"
    assets:
      links:
        - name: ominous-security-$CI_COMMIT_TAG.zip
          url: $CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/ominous-security-$CI_COMMIT_TAG.zip?job=package
          link_type: package
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
