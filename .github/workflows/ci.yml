# CI/CD de Ominous Security
#
#   lint        sintaxis, 'use strict', JSON válido y sin caracteres invisibles/bidi
#   test        tests en Node 20, 22 y 24 (JUnit y cobertura en 22)
#   self-scan   la herramienta se analiza a sí misma; hallazgos en Security > Code scanning
#   audit       npm audit de las dependencias
#   docker      imagen con prueba de humo y escaneo Trivy; se publica en GHCR desde main y etiquetas
#   package     zip del código
#   pages       demo en GitHub Pages (modo demo, sin servidor) desde main
#   release     release de GitHub al subir una etiqueta vX.Y.Z
#
# Solo usa acciones oficiales de GitHub (actions/*, github/*): nada de terceros con acceso a los secretos.

name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  OMINOUS_OFFLINE: '1'   # los tests no dependen de OSV.dev
  EXCLUDE: lib/rules.js,lib/decoder.js,lib/extra.js,public/index.html,README.md,test/,node_modules/

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: Tests
        if: matrix.node != 22
        run: npm test
      - name: Tests con cobertura
        if: matrix.node == 22
        run: |
          npm run test:ci | tee test-output.txt
          {
            echo '### Cobertura'
            echo '```'
            grep -E 'file +\||all files' test-output.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && matrix.node == 22
        with:
          name: junit
          path: junit.xml

  # La herramienta se analiza a sí misma. Las firmas de ataques (rules.js, la demo,
  # el README) se excluyen igual que un antivirus excluye su base de firmas.
  self-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      OMINOUS_OFFLINE: '0'   # aquí sí consulta OSV.dev para las dependencias
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Ominous Security sobre su propio código
        run: node bin/ominous-scan.js . --exclude "$EXCLUDE" --fail-on red --sarif ominous.sarif --json ominous-report.json
      - name: Subir hallazgos a Code scanning
        if: always() && github.event.repository.visibility == 'public'
        uses: github/codeql-action/upload-sarif@9f759ee644a3e7c15c1390abf49868036c00067b # v3.38.3
        with:
          sarif_file: ominous.sarif
          category: ominous-security
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ominous-report
          path: ominous-report.json

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm audit --audit-level=high --include=optional

  package:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Zip del código
        run: |
          NAME="ominous-security-${GITHUB_REF_NAME//\//-}"
          [ "$GITHUB_REF_TYPE" = tag ] || NAME="ominous-security-${GITHUB_SHA::7}"
          git archive --format=zip --prefix=ominous-security/ -o "$NAME.zip" HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package
          path: ominous-security-*.zip

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Construir imagen
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build --pull -t "$IMAGE:${GITHUB_SHA::7}" .
      - name: Prueba de humo
        run: |
          docker run -d --name smoke "$IMAGE:${GITHUB_SHA::7}"
          for i in $(seq 1 20); do docker exec smoke wget -qO- --header "Host: localhost:8080" http://127.0.0.1:8080/api/health && break; sleep 1; done
          docker exec smoke wget -qO- --header "Host: localhost:8080" http://127.0.0.1:8080/api/health | grep -q '"ok":true'
          docker exec -e OMINOUS_OFFLINE=1 smoke ominous-scan /app --exclude lib/rules.js,lib/decoder.js,lib/extra.js,public/index.html --fail-on red
          docker rm -f smoke
      - name: Escaneo de vulnerabilidades de la imagen (Trivy)
        run: |
          # Se le pasa la imagen exportada en un tar, sin darle acceso al socket de Docker.
          docker save -o image.tar "$IMAGE:${GITHUB_SHA::7}"
          docker run --rm -v "$PWD/image.tar:/image.tar:ro" aquasec/trivy:0.58.1 image \
            --input /image.tar --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 --no-progress
          rm image.tar
      - name: Publicar en GitHub Container Registry
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:${GITHUB_SHA::7}"
          if [ "$GITHUB_REF" = refs/heads/main ]; then docker tag "$IMAGE:${GITHUB_SHA::7}" "$IMAGE:latest" && docker push "$IMAGE:latest"; fi
          if [ "$GITHUB_REF_TYPE" = tag ]; then docker tag "$IMAGE:${GITHUB_SHA::7}" "$IMAGE:$GITHUB_REF_NAME" && docker push "$IMAGE:$GITHUB_REF_NAME"; fi

  # Demo en Cloudflare Pages, con la infraestructura en Terraform (como el CV).
  # Sin las credenciales configuradas solo genera la demo y no despliega nada.
  pages:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [lint, test, self-scan]
    timeout-minutes: 15
    concurrency: pages
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
      TF_WORKSPACE: ominous-security
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      TF_IN_AUTOMATION: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Generar la demo
        run: node scripts/build-site.js dist
      - name: Comprobar credenciales
        id: cf
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$TF_TOKEN_app_terraform_io" ] || [ -z "$TF_CLOUD_ORGANIZATION" ]; then
            echo "Faltan credenciales de Cloudflare o HCP Terraform: solo se genera la demo." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else echo "ready=true" >> "$GITHUB_OUTPUT"; fi
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: steps.cf.outputs.ready == 'true'
        with:
          terraform_wrapper: false
      - name: Aplicar la infraestructura
        if: steps.cf.outputs.ready == 'true'
        run: |
          terraform -chdir=infra init -input=false
          terraform -chdir=infra fmt -check
          terraform -chdir=infra validate
          terraform -chdir=infra apply -input=false -auto-approve -lock-timeout=60s
      - name: Desplegar en Cloudflare Pages
        if: steps.cf.outputs.ready == 'true'
        run: |
          npm ci --prefix tools/deploy --no-audit --no-fund
          PROJECT=$(terraform -chdir=infra output -raw project_name)
          tools/deploy/node_modules/.bin/wrangler pages deploy dist --project-name "$PROJECT" --branch main | tee out.txt
          echo "URL: $(terraform -chdir=infra output -raw url)" >> "$GITHUB_STEP_SUMMARY"

  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs: [package, docker, self-scan]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: package
      - name: Comprobar que la etiqueta coincide con package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          [ "$GITHUB_REF_NAME" = "v$VERSION" ] || { echo "La etiqueta $GITHUB_REF_NAME no coincide con la versión $VERSION de package.json"; exit 1; }
      - name: Crear release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:$GITHUB_REF_NAME"
          gh release create "$GITHUB_REF_NAME" ominous-security-*.zip --generate-notes \
            --title "Ominous Security $GITHUB_REF_NAME" --notes "Imagen Docker: \`docker pull $IMAGE\`"
